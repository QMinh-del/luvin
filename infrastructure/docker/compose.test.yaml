services:
  postgres:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    environment:
      POSTGRES_USER: luvin
      POSTGRES_PASSWORD: luvin
      POSTGRES_DB: luvin_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luvin -d luvin_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: luvin
      MINIO_ROOT_PASSWORD: luvinminio
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: luvin
      MINIO_ROOT_PASSWORD: luvinminio
      MINIO_AVATAR_BUCKET: luvin-test-avatars
      MINIO_EXPORT_BUCKET: luvin-test-exports
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set luvin http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing luvin/"$$MINIO_AVATAR_BUCKET"
        mc mb --ignore-existing luvin/"$$MINIO_EXPORT_BUCKET"
        mc anonymous set none luvin/"$$MINIO_AVATAR_BUCKET"
        mc anonymous set none luvin/"$$MINIO_EXPORT_BUCKET"
