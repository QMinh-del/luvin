name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
# Lockfile caches only. These jobs receive no production secrets.

jobs:
  backend:
    name: Backend lint, typecheck, and tests
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript workspaces
        run: npm ci
      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate
      - name: Check formatting
        run: npm run format:check
      - name: Lint (@luvin/api)
        run: npm run lint --workspace=@luvin/api
      - name: Typecheck (workspaces)
        run: npm run typecheck
      - name: Unit tests (workspaces)
        run: npm run test

  prisma:
    name: Prisma migration validation
    runs-on: ubuntu-latest
    environment: ci
    services:
      postgres:
        image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
        env:
          POSTGRES_USER: luvin
          POSTGRES_PASSWORD: luvin
          POSTGRES_DB: luvin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luvin -d luvin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript workspaces
        run: npm ci
      - name: Apply migrations to an empty database (@luvin/api)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://luvin:luvin@127.0.0.1:5432/luvin_ci?schema=public
        run: npx prisma migrate deploy && npx prisma migrate status

  api-integration:
    name: API local-infrastructure integration tests
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript workspaces
        run: npm ci
      - name: Start isolated test Compose
        run: npm run infra:test:up
      - name: Verify API connectivity to test services
        env:
          RUN_INFRA_TESTS: "1"
        run: npm run infra:verify
      - name: Stop test Compose
        if: always()
        run: npm run infra:test:down

  mobile:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true
      - name: Install Flutter packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze (@luvin/mobile)
        run: npm run mobile:analyze
      - name: Widget tests (@luvin/mobile)
        run: npm run mobile:test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/src" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/src --verbose --redact

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install JavaScript workspaces
        run: npm ci
      - name: npm audit (fail on critical)
        run: npm audit --audit-level=critical
      - name: Report remaining npm audit findings
        run: npm audit || true
